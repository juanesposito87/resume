const T={en:{pdf:"Export to PDF",hint:"In the print dialog choose “Save as PDF”."},es:{pdf:"Exportar a PDF",hint:"En el diálogo de impresión elegí “Guardar como PDF”."}};
function setLang(l){
 const L=D[l],c=D.c;
 document.documentElement.lang=l;document.title=L.file;
 ["en","es"].forEach(x=>document.getElementById("b-"+x).classList.toggle("on",x===l));
 document.getElementById("b-pdf").textContent=T[l].pdf;document.getElementById("hint").textContent=T[l].hint;
 const sec=t=>`<h2>${t}</h2>`;
 let h=`<div class="head"><div><h1>${D.name}</h1><div class="title">${L.title}</div><div class="contact"><span>${L.loc}</span><span><a href="tel:${c.tel}">${c.phone}</a></span><span><a href="mailto:${c.email}">${c.email}</a></span><span><a href="${c.li_url}" target="_blank" rel="noopener">${c.li_text}</a></span></div></div><img class="photo" src="${D.photo}" alt="${D.name}"></div>`;
 h+=sec(L.h_summary)+`<p style="margin:0">${L.summary}</p>`;
 h+=sec(L.h_exp);
 L.exp.forEach(e=>{
  h+=`<div class="row org"><span>${e.org}</span>${e.org_dates?`<span>${e.org_dates}</span>`:""}</div>`;
  e.roles.forEach(r=>{
   h+=`<div class="role-block"><div class="row role"><b>${r.title}</b><span class="dt">${r.dates} · ${r.place}</span></div>`;
   if(r.desc)h+=`<div class="desc">${r.desc}</div>`;
   h+=`<ul>${r.bullets.map(b=>`<li>${b}</li>`).join("")}</ul></div>`;
  });
 });
 h+=sec(L.h_edu)+L.edu.map(([s,d,y])=>`<div class="row edu"><span><b>${s}</b> — ${d}</span><span class="y">${y}</span></div>`).join("");
 h+=sec(L.h_lang)+`<div>${L.langs.map(([a,b])=>`<b>${a}:</b> ${b}`).join("  |  ")}</div>`;
 h+=sec(L.h_comp)+L.comp.map(([a,b])=>`<div class="c"><b>${a}:</b> ${b}</div>`).join("");
 document.getElementById("cv").innerHTML=h;
 try{history.replaceState(null,"","#"+l)}catch(e){}
}
setLang(location.hash==="#es"?"es":"en");
</script></body></html>
